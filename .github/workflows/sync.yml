name: Upstream Sync

permissions:
  contents: write
  workflows: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # Step 1: run a standard checkout action
      - name: Checkout target repo
        uses: actions/checkout@v6

      # Step 2: run the sync action
      - name: Sync upstream changes
        id: sync
        uses: aormsby/fork-sync-with-upstream-action@v3.4.3
        with:
          upstream_sync_repo: cmliu/edgetunnel
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # automatically generated, no need to set

          # Set test_mode true to run tests instead of the true action!!
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 同步失败，尝试强制使用上游版本..."

      - name: Auto resolve conflicts - prefer upstream
        if: failure()
        run: |
          echo "Sync failed, forcing upstream version..."
          git remote add upstream https://github.com/cmliu/edgetunnel.git || true
          git fetch upstream
          git reset --hard upstream/main
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
