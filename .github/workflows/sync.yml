name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # Step 1: run a standard checkout action
      - name: Checkout target repo
        uses: actions/checkout@v6

      # Step 2: run the sync action
      - name: Sync upstream changes
        id: sync
        uses: aormsby/fork-sync-with-upstream-action@v3.4.3
        with:
          upstream_sync_repo: cmliu/edgetunnel
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # automatically generated, no need to set

          # Set test_mode true to run tests instead of the true action!!
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 检测到同步失败，检查是否有冲突..."
          echo "[Info] 将尝试自动解决冲突，使用上游版本..."

      - name: Auto resolve conflicts - prefer upstream
        if: always()
        run: |
          # Add upstream remote if not exists
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/cmliu/edgetunnel.git
          fi
          git fetch upstream
          
          # Check if there are merge conflicts
          if git ls-files -u | grep -q .; then
            echo "🔀 Detected merge conflicts, using upstream version..."
            # Abort the merge
            git merge --abort || true
            # Reset to upstream
            git reset --hard upstream/main
            git push --force origin main || true
          fi
