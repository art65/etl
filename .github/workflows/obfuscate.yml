name: Sync and Obfuscate Worker

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["Upstream Sync"]
    types:
      - completed
  push:
    paths:
      - '_worker.js'
  workflow_dispatch:

jobs:
  obfuscate_worker:
    name: Obfuscate and compress worker after sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Check if obfuscation is needed
        id: check_sync
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "🔍 [日志] 检查上游同步状态..."
            
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "⚠️ [日志] 上游同步未成功，跳过混淆。"
              echo "SKIP=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # 检查最近 15 分钟内是否有更新 _worker.js 的新提交
            if ! git log --since="15 minutes ago" --name-only | grep -q "^_worker\.js$"; then
              echo "ℹ️ [日志] 上游无新提交，或新提交未涉及 _worker.js 的修改，跳过混淆与部署。"
              echo "SKIP=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            echo "✅ [日志] 检测到上游同步更新了 _worker.js，即将开始混淆流程！"
          fi
          echo "SKIP=false" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.check_sync.outputs.SKIP != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        if: steps.check_sync.outputs.SKIP != 'true'
        run: npm install @babel/parser @babel/traverse @babel/generator @babel/types terser

      - name: Obfuscate and compress _worker.js
        if: steps.check_sync.outputs.SKIP != 'true'
        run: |
          if [ -f "_worker.js" ]; then
            echo "📦 Found _worker.js, starting obfuscation..."
            node scripts/obfuscate.js _worker.js _worker.min.js
            echo "✅ Obfuscation completed"
            echo "📄 Generated: _worker.min.js"
          else
            echo "⚠️  _worker.js not found, skipping obfuscation"
            exit 0
          fi

      - name: Commit and push compressed file
        if: steps.check_sync.outputs.SKIP != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -f "_worker.min.js" ]; then
            # 计算新生成文件的 hash
            NEW_HASH=$(git hash-object _worker.min.js)
            # 获取已提交文件的 hash（如果存在）
            OLD_HASH=$(git show HEAD:_worker.min.js 2>/dev/null | git hash-object --stdin 2>/dev/null || echo "")
            
            if [ "$NEW_HASH" != "$OLD_HASH" ]; then
              echo "📦 File changed, committing..."
              git add _worker.min.js
              git commit -m "🔀 Add obfuscated _worker.min.js"
              git push origin main
              echo "✅ Compressed file committed and pushed"
            else
              echo "ℹ️  No changes detected, skipping commit"
            fi
          else
            echo "⚠️  No compressed file generated"
          fi
